[workspace]
resolver = "2"
members = ["crates/domain", "crates/service"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
marketplace-domain = { path = "crates/domain" }
anyhow = "1"
axum = "0.8"
base64 = "0.22"
# Receipt content hashes use BLAKE3, the same function the prototype engine
# and the client attachment hashing use (@noble/hashes/blake3).
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
http-body-util = "0.1"
# Pinned: the authoritative Pubky AuthToken implementation, from the same
# pubky/pubky-homeserver repository the @synonymdev/pubky SDK is built from.
# The signature encoding was refactored between minor versions, but tokens
# were measured to round-trip between 0.8.0 and 0.11.0 in both directions, so
# clients on an older SDK still verify here. The exact pin is kept so a future
# format change surfaces as a deliberate upgrade rather than a silent break.
pubky-common = "=0.11.0"
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
    "uuid",
    "json",
    "migrate",
    "macros",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.dev]
debug = 1
